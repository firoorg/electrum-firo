name: Spark tests


on:
  push:
    branches:
    - '*'
  pull_request:
    branches:
    - '*'

jobs:
  spark_tests:
    runs-on: ubuntu-22.04
    name: Spark ABI and wallet tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libsecp256k1-dev
      - name: Build libsparkmobile
        run: ./contrib/make_libsparkmobile.sh
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # The generated payment request bindings require the older protobuf runtime.
          python -m pip install '.[gui,tests]' -r contrib/requirements/requirements-tests.txt 'protobuf==3.20.3'
      - name: Run Spark tests
        env:
          ELECTRUM_REQUIRE_LIBSPARKMOBILE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v electrum_dash.tests.test_libsparkmobile
          python -m unittest discover -v -s electrum_dash/tests -t . -p 'test_spark*.py'
